name: Publish LightAway v0.4.1b1 (one-time)
on:
  workflow_run:
    workflows: ["LightAway CI"]
    types: [completed]
permissions:
  contents: write
jobs:
  prerelease:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_commit.message == 'chore(prerelease): prepare v0.4.1b1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Confirm version and release intent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("custom_components/lightaway/manifest.json").read_text())
          assert manifest["version"] == "0.4.1b1"
          notes = Path(".github/RELEASE_NOTES_0.4.1b1.md").read_text()
          assert notes.startswith("# LightAway 0.4.1 Beta 1")
          assert "Pre-release" in notes
          assert Path("CHANGELOG.md").read_text().startswith("# LightAway 0.4.1 Beta 1")
          PY
      - name: Create GitHub pre-release (do not change latest stable)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view v0.4.1b1 >/dev/null 2>&1; then
            echo "v0.4.1b1 exists; skip duplicate."
            exit 0
          fi
          gh release create v0.4.1b1 \
            --target "$RELEASE_SHA" \
            --title "LightAway 0.4.1 Beta 1" \
            --notes-file .github/RELEASE_NOTES_0.4.1b1.md \
            --prerelease \
            --latest=false
