name: Publish LightAway v0.4.1b3 (one-time)
on:
  workflow_run:
    workflows: ["LightAway CI"]
    types: [completed]
permissions:
  contents: write
jobs:
  prerelease:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_commit.message == 'chore(prerelease): prepare v0.4.1b3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify beta metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path("custom_components/lightaway/manifest.json").read_text())["version"] == "0.4.1b3"
          text = Path(".github/RELEASE_NOTES_0.4.1b3.md").read_text()
          assert text.startswith("# LightAway 0.4.1 Beta 3")
          assert "Pre-release" in text
          assert Path("CHANGELOG.md").read_text().startswith("# LightAway 0.4.1 Beta 3")
          PY
      - name: Publish pre-release without changing latest stable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view v0.4.1b3 >/dev/null 2>&1; then
            echo "Pre-release v0.4.1b3 exists; skipping duplicate."
            exit 0
          fi
          gh release create v0.4.1b3 \
            --target "$RELEASE_SHA" \
            --title "LightAway 0.4.1 Beta 3" \
            --notes-file .github/RELEASE_NOTES_0.4.1b3.md \
            --prerelease \
            --latest=false
