name: Publish LightAway 0.1.0 (one-time)
on:
  workflow_run:
    workflows: ["LightAway CI"]
    types: [completed]
permissions:
  contents: write
jobs:
  release:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_commit.message == 'chore(release): prepare initial 0.1.0 release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Check release version and notes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path("custom_components/lightaway/manifest.json").read_text())["version"] == "0.1.0"
          assert Path("CHANGELOG.md").read_text().startswith("# LightAway 0.1.0")
          PY
      - name: Create version tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists; no duplicate published."
            exit 0
          fi
          gh release create v0.1.0 --target "$RELEASE_SHA" --title "LightAway 0.1" --notes-file CHANGELOG.md --latest
